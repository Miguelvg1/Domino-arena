<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corregir puntos · Titanes Dominó</title><meta name="theme-color" content="#07111f"><style>:root{--bg:#07111f;--card:#10243a;--line:#294765;--text:#f8fafc;--muted:#9fb0c4;--gold:#f7c948;--red:#ef4444;--green:#19c37d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173454,#07111f 48%);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 12px 60px}.hero,.card{background:linear-gradient(180deg,#142a44,var(--card));border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0}.hero{background:linear-gradient(135deg,#173b62,#4b2f84 60%,#7c2d12)}h1{margin:6px 0}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.entry{padding:13px 0;border-bottom:1px solid #ffffff18}.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:900;cursor:pointer}.danger{background:var(--red);color:#fff}.dark{background:#294765;color:#fff}.badge{border:1px solid #ffffff25;background:#ffffff10;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.voided{opacity:.55}.notice{padding:12px;border-radius:14px;background:#102d25;border:1px solid #1f6f54;color:#bbf7d0}.error{background:#3a1517;border-color:#7f1d1d;color:#fecaca}.small{font-size:12px}@media(max-width:520px){.entry.row{align-items:flex-start}.entry .btn{padding:9px}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">🛡️ PRESIDENCIA</span><h1>Corregir puntos</h1><p>Anula únicamente la anotación registrada por error. El sistema conserva el historial y recalcula el marcador automáticamente.</p></section><div id="app" class="card">Cargando…</div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://hvpyngkqtqzvmweavego.supabase.co','sb_publishable_fZbTJCeuM8otLDnnoxRc9w_OGdZIXhX'),app=document.querySelector('#app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={normal:'Puntos',multa:'Multa',capicua:'Capicúa',paso_corrido:'Paso corrido',paso_salida_doble:'Salida doble',dos_carotas:'2 caritas',chivo:'Chivo',pase_con_ficha:'Pase con ficha'};async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML='<div class="notice error"><b>Debes iniciar sesión primero en Titanes Dominó.</b></div><p><a href="/" style="color:#f7c948">← Ir a iniciar sesión</a></p>';return}const{data:me,error:meErr}=await sb.from('members').select('id,role,full_name,nickname').eq('auth_user_id',session.user.id).single();if(meErr||!me){app.innerHTML='<div class="notice error">No se encontró tu perfil.</div>';return}if(me.role!=='admin'){app.innerHTML='<div class="notice error"><b>Acceso restringido.</b><br>Solo Presidencia puede corregir anotaciones desde este panel.</div>';return}const{data,error}=await sb.from('score_events').select('id,game_id,team,event_type,points,voided,created_at,credited:members!score_events_credited_member_id_fkey(full_name,nickname),games(status,largos_score,cortos_score,club_tables(name))').order('created_at',{ascending:false}).limit(100);if(error){app.innerHTML='<div class="notice error">'+esc(error.message)+'</div>';return}const active=(data||[]).filter(x=>!x.voided);app.innerHTML='<div class="row"><div class="grow"><b>Últimas anotaciones</b><div class="small muted">'+active.length+' disponibles para corregir</div></div><button class="btn dark" id="refresh">↻</button></div>'+active.map(x=>`<div class="entry row"><div class="grow"><b>${x.team==='L'?'🔵':'🔴'} ${esc(labels[x.event_type]||x.event_type)} · +${Number(x.points)}</b><div class="small muted">${esc(x.credited?.nickname||x.credited?.full_name||'Jugador')} · ${esc(x.games?.club_tables?.name||'Mesa')} · ${new Date(x.created_at).toLocaleString('es-DO')}</div><div class="small">Marcador actual: ${Number(x.games?.largos_score||0)} — ${Number(x.games?.cortos_score||0)} · ${esc(x.games?.status||'')}</div></div><button class="btn danger" data-void="${x.id}" data-points="${Number(x.points)}">🗑️ Anular</button></div>`).join('')||'<p class="muted">No hay anotaciones activas.</p>';document.querySelector('#refresh').onclick=load;document.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>voidEvent(b.dataset.void,+b.dataset.points))}async function voidEvent(id,points){const reason=prompt(`Vas a anular ${points} puntos.\n\nEscribe el motivo de la corrección:`,`Anotación registrada por error`);if(reason===null)return;if(!reason.trim())return alert('Debes indicar el motivo.');if(!confirm(`¿Confirmas anular esta anotación de ${points} puntos?\n\nEl marcador será recalculado automáticamente.`))return;const{error}=await sb.rpc('void_score_event',{p_event_id:id,p_reason:reason.trim()});if(error)return alert('No se pudo corregir: '+error.message);alert('✅ Anotación anulada. El marcador fue recalculado.');await load()}load();</script></body></html>
