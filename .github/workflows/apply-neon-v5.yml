name: Aplicar Titanes Neon V5

on:
  push:
    branches: [ 'redesign/neon-titanes-v5' ]
    paths:
      - 'scripts/neon_titanes_v5.py'
      - '.github/workflows/apply-neon-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  neon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar rediseño neon
        run: python3 scripts/neon_titanes_v5.py
      - name: Validar HTML y JavaScript
        run: |
          grep -q 'TITANES_NEON_V5' index.html
          grep -q 'PIZARRA EN VIVO' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('No module script')
          Path('/tmp/titanes-neon.mjs').write_text(m.group(1),encoding='utf-8')
          if len(s)>180000: raise SystemExit('index.html demasiado grande')
          print('HTML',len(s),'bytes')
          PY
          node --check /tmp/titanes-neon.mjs
      - name: Guardar index rediseñado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rediseña Titanes con interfaz neon V5" || exit 0
          git push
