name: Build isolated Titanes Android test APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/score-action-feedback-lab-20261120
    paths:
      - '.github/workflows/build-android-test-apk.yml'

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Run score behavior tests
        run: |
          node tests/score-ui-contract.test.mjs
          node tests/score-actions-runtime.test.mjs
      - name: Install dependencies
        run: npm install
      - name: Prepare Capacitor assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www android
          mkdir www
          rsync -a ./ www/ --exclude '.git' --exclude '.github' --exclude 'www' --exclude 'android' --exclude 'node_modules' --exclude 'package.json' --exclude 'package-lock.json' --exclude 'capacitor.config.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('capacitor.config.json')
          data=json.loads(path.read_text())
          # Test APK must never write to the live club database.
          html=Path('www/index.html')
          src=html.read_text()
          prod_url='https://hvpyngkqtqzvmweavego.supabase.co'
          prod_key='sb_publishable_fZbTJCeuM8otLDnnoxRc9w_OGdZIXhX'
          assert src.count(prod_url)==1 and src.count(prod_key)==1, 'Unexpected production configuration'
          src=src.replace(prod_url,'https://ybtdxjqodcjoccyuauzv.supabase.co')
          src=src.replace(prod_key,'sb_publishable_kwqHU1p_F_C_u7J_nWau9Q_9xq2sbuk')
          assert prod_url not in src and prod_key not in src, 'Production endpoint remains in test APK'
          html.write_text(src)
          data['appId']='com.titanesdomino.app.test'
          data['appName']='Titanes Dominó PRUEBAS'
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          variables=Path('android/variables.gradle')
          s=variables.read_text().replace('compileSdkVersion = 35','compileSdkVersion = 36').replace('targetSdkVersion = 35','targetSdkVersion = 36').replace('minSdkVersion = 23','minSdkVersion = 24')
          variables.write_text(s)
          gradle=Path('android/app/build.gradle')
          s=gradle.read_text()
          assert 'applicationId "com.titanesdomino.app.test"' in s, 'Test package ID not found'
          gradle.write_text(s)
          PY
      - name: Build independent debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify independent package
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.titanesdomino.app.test'"
          mkdir -p release
          cp "$APK" release/Titanes-Domino-PRUEBAS-1.0.4.apk
          sha256sum release/Titanes-Domino-PRUEBAS-1.0.4.apk
      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: Titanes-Domino-PRUEBAS-APK-1.0.4
          path: release/Titanes-Domino-PRUEBAS-1.0.4.apk
          retention-days: 14
          if-no-files-found: error
