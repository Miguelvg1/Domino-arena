name: Build Android Google Play

on:
  push:
    branches:
      - android/play-release-v1
    paths:
      - 'android-play/**'
      - '.github/workflows/build-android-play.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-play

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate Android project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build unsigned release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify AAB
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: titanes-domino-1.0.0-unsigned-aab
          path: android-play/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
