name: Build Android Google Play

on:
  push:
    branches: [ "android/play-release-v1" ]
    paths:
      - "android-play/**"
      - ".github/workflows/build-android-play.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-play
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Restore upload keystore when configured
        if: ${{ secrets.TITANES_KEYSTORE_BASE64 != '' }}
        env:
          TITANES_KEYSTORE_BASE64: ${{ secrets.TITANES_KEYSTORE_BASE64 }}
        run: echo "$TITANES_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/titanes-upload.jks"

      - name: Build release AAB
        env:
          TITANES_KEYSTORE_PATH: ${{ secrets.TITANES_KEYSTORE_BASE64 != '' && format('{0}/titanes-upload.jks', runner.temp) || '' }}
          TITANES_KEYSTORE_PASSWORD: ${{ secrets.TITANES_KEYSTORE_PASSWORD }}
          TITANES_KEY_ALIAS: ${{ secrets.TITANES_KEY_ALIAS }}
          TITANES_KEY_PASSWORD: ${{ secrets.TITANES_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify AAB
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: titanes-domino-1.0.0-aab
          path: android-play/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
