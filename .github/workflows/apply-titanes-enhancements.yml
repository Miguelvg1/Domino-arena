name: Aplicar mejoras Titanes

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/enhance_titanes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aplicar mejoras de interfaz y pizarra
        run: python3 scripts/enhance_titanes.py
      - name: Validar estructura y JavaScript
        run: |
          grep -q 'TITANES_DASHBOARD_V4' index.html
          grep -q 'PIZARRA EN VIVO' index.html
          grep -q 'chatBadge' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m:
              raise SystemExit('No se encontró script module')
          Path('/tmp/titanes.mjs').write_text(m.group(1),encoding='utf-8')
          if len(s)>150000:
              raise SystemExit('index.html creció demasiado')
          a=Path('anotaciones-v2.html').read_text(encoding='utf-8')
          if 'annotation-specials.js' not in a:
              raise SystemExit('No se integró annotation-specials.js en anotaciones-v2.html')
          print('HTML',len(s),'bytes | Anotaciones',len(a),'bytes')
          PY
          node --check /tmp/titanes.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html anotaciones-v2.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git commit -m "Aplicar mejoras de inicio y anotaciones Titanes"
          git push
