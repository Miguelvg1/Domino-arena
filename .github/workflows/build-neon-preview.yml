name: Construir preview Neon V5

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-neon-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama de rediseño
        uses: actions/checkout@v4
        with:
          ref: redesign/neon-titanes-v5
          fetch-depth: 0
      - name: Aplicar rediseño
        run: python3 scripts/neon_titanes_v5.py
      - name: Validar HTML y JavaScript
        run: |
          grep -q 'TITANES_NEON_V5' index.html
          grep -q 'PIZARRA EN VIVO' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('No module script')
          Path('/tmp/titanes-neon.mjs').write_text(m.group(1),encoding='utf-8')
          if len(s)>180000: raise SystemExit('index.html demasiado grande')
          print('HTML',len(s),'bytes')
          PY
          node --check /tmp/titanes-neon.mjs
      - name: Guardar en rama de preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Construye interfaz Neon Titanes V5" || exit 0
          git push origin HEAD:redesign/neon-titanes-v5
