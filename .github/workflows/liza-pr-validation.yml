name: Validate liza release candidate
on:
  pull_request:
    paths:
      - 'src/liza-*.mjs'
      - 'index.html'
      - '.github/workflows/liza-pr-validation.yml'
  workflow_dispatch:
jobs:
  liza-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Liza calculation
        run: node src/liza-calculator.test.mjs
      - name: Match correction simulation
        run: node src/liza-match-simulation.test.mjs
      - name: Scoring UI wiring
        run: node src/liza-ui-smoke.test.mjs
