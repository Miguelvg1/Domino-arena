name: Sincronizar Titanes desde Vercel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar versión de producción
        run: |
          curl -fsSL https://titanes-domino-app-v21.vercel.app -o index.html
          curl -fsSL https://titanes-domino-app-v21.vercel.app/privacidad -o privacidad
          curl -fsSL https://titanes-domino-app-v21.vercel.app/eliminar-cuenta -o eliminar-cuenta
          printf '{\n  "cleanUrls": true\n}\n' > vercel.json

      - name: Guardar copia base en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html privacidad eliminar-cuenta vercel.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Sincroniza versión actual de Titanes desde Vercel"
          git push
