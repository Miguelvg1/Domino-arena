name: Liza scoring regression tests
on:
  push:
    branches:
      - feature/lizas-y-conceptos-30-60
  pull_request:
  workflow_dispatch:
jobs:
  liza-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Liza calculator tests
        run: node src/liza-calculator.test.mjs
      - name: Match simulation tests
        run: node src/liza-match-simulation.test.mjs
