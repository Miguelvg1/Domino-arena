name: Build Titanes Dominó Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets for Capacitor
        run: |
          rm -rf www android
          mkdir -p www
          rsync -av ./ www/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'www' \
            --exclude 'android' \
            --exclude 'node_modules' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'capacitor.config.json'

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Set Android API and version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          variables = Path('android/variables.gradle')
          s = variables.read_text()
          s = s.replace('compileSdkVersion = 35', 'compileSdkVersion = 36')
          s = s.replace('targetSdkVersion = 35', 'targetSdkVersion = 36')
          variables.write_text(s)

          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('versionCode 1', 'versionCode 2')
          s = s.replace('versionName "1.0"', 'versionName "1.0.1"')
          p.write_text(s)
          PY

      - name: Restore permanent upload key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/titanes-upload.jks"
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/titanes-upload.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias titanes-upload >/dev/null

      - name: Build signed release AAB
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/titanes-upload.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=titanes-upload \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Verify permanent upload certificate
        shell: bash
        run: |
          set -euo pipefail
          SHA1=$(keytool -list -v \
            -keystore "$GITHUB_WORKSPACE/titanes-upload.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias titanes-upload | sed -n 's/^[[:space:]]*SHA1: //p' | head -n1)
          EXPECTED="65:8E:D6:56:20:47:D2:6D:31:7D:8E:DA:73:5F:F3:19:DC:52:D7:E5"
          echo "Upload certificate SHA1: $SHA1"
          test "$SHA1" = "$EXPECTED"

      - name: Verify AAB signature
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          jarsigner -verify "$AAB"
          mkdir -p release
          cp "$AAB" "release/Titanes-Domino-Alpha-1.0.1.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Titanes-Domino-Alpha-AAB-API36
          path: release/Titanes-Domino-Alpha-1.0.1.aab
          if-no-files-found: error
          retention-days: 30
