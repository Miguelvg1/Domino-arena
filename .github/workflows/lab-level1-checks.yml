name: Laboratory level 1 checks
on:
  push:
    branches: [test/lab-isolated-score-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/lab-level1.test.mjs scripts/lab-level1-functional.test.mjs
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: titanes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute isolated PostgreSQL scoring tests
        env:
          PGPASSWORD: test_only
        run: psql -h localhost -U postgres -d titanes_test -v ON_ERROR_STOP=1 -f scripts/lab-level1-postgres.sql\n      - name: Execute contract-shaped PostgreSQL scoring tests\n        env:\n          PGPASSWORD: test_only\n        run: psql -h localhost -U postgres -d titanes_test -v ON_ERROR_STOP=1 -f scripts/lab-level1-contract-shape.sql
