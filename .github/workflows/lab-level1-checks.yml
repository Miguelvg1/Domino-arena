name: Laboratory level 1 checks
on:
  push:
    branches: [test/lab-isolated-score-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/lab-level1.test.mjs
