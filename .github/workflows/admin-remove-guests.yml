name: Guest removal safety checks
on:
  push:
    branches: [feature/admin-remove-guests-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/admin-remove-guests.test.mjs
