name: Android TV prototype APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/torneos-tv-diciembre-2026
    paths:
      - 'tv/**'
      - 'scripts/enable_android_tv.cjs'
      - '.github/workflows/android-tv-prototype.yml'
permissions:
  contents: read
jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Assemble isolated TV-only web assets
        run: |
          mkdir -p www
          cp tv/index.html tv/tv.css tv/tv.js www/
      - name: Generate Capacitor Android project
        run: |
          if [ ! -f android/gradlew ]; then npx cap add android; fi
          npx cap sync android
      - name: Enable TV launcher and banner
        run: node scripts/enable_android_tv.cjs
      - name: Validate Android TV launcher configuration
        run: |
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.touchscreen.*android:required="false"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/drawable-nodpi/tv_banner.png
          test -s www/index.html
      - name: Build Android TV debug APK for internal testing
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: titanes-android-tv-debug-unsigned-for-testing
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
