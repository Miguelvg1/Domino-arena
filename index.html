access_status)} · ${x.login_username?'👤 '+esc(x.login_username):'sin usuario'} · ${x.has_pin?'🔐 PIN listo':'sin PIN'}</small></div></div><details><summary>📋 Ver datos del miembro</summary><div class="small muted" style="padding-top:8px">Nombre: ${esc(x.full_name||'')}<br>Apodo: ${esc(x.nickname||'')}<br>Teléfono: ${esc(x.phone||'')}<br>Correo: ${esc(x.email||'')}<br>Usuario: ${esc(x.login_username||'Sin asignar')}<br>Estado: ${esc(x.access_status||'')}</div></details>${x.id!==me.id?`<button class="btn" data-a="setLogin" data-id="${x.id}" data-name="${esc(x.nickname||x.full_name)}">🔐 Restablecer usuario/PIN</button><button class="btn dark" data-a="adminStatus" data-id="${x.id}" data-s="suspension_momentanea">⏸️ Suspender</button>${x.access_status!=='activo'?`<button class="btn green" data-a="adminStatus" data-id="${x.id}" data-s="activo">▶️ Reactivar</button>`:''}`:''}</div>`).join('')}</div><div class="card"><h2>🪑 Mesas</h2>${(t.data||[]).map(x=>`<button class="btn dark" data-a="release" data-id="${x.id}" data-n="${esc(x.name)}">Liberar ${esc(x.name)}</button>`).join('')}</div>`}
async function adminCreateMember(){let full_name=$('#acn').value.trim(),nickname=$('#aca').value.trim(),username=$('#acu').value.trim().toLowerCase(),pin=$('#acp').value.trim();if(!full_name)return alert('Escribe el nombre completo.');if(!/^[a-z0-9._-]{3,24}$/.test(username))return alert('El usuario debe tener de 3 a 24 caracteres.');if(!/^\d{4}$/.test(pin))return alert('El PIN debe tener exactamente 4 números.');if(!confirm('¿Crear y activar a '+(nickname||full_name)+'?\nUsuario: '+username))return;let btn=$('#adminCreateBtn');if(btn){btn.disabled=true;btn.textContent='⏳ Creando miembro…'}try{let x=await sb.auth.getSession(),token=x.data.session?.access_token,r=await fetch(URL+'/functions/v1/admin-create-member',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+token},body:JSON.stringify({full_name,nickname,username,pin})}),j=await r.json();if(!r.ok)throw new Error(j.error||'No se pudo crear');alert('✅ MIEMBRO CREADO Y ACTIVO\n\n'+(nickname||full_name)+' ya puede entrar.\nUsuario: '+username+'\nPIN: '+pin);render()}catch(e){alert('No se pudo registrar: '+(e?.message||e));if(btn){btn.disabled=false;btn.textContent='✅ Crear miembro y activar acceso'}}}
async function approveReq(id,name){if(!confirm('¿Aprobar el ingreso de '+name+'?'))return;let s=await sb.auth.getSession(),token=s.data.session?.access_token,r=await fetch(URL+'/functions/v1/approve-membership',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+token},body:JSON.stringify({request_id:id})}),j=await r.json();if(!r.ok)return alert(j.error||'No se pudo aprobar');alert(`✅ ${name} aprobado. Ya puede entrar con el usuario y PIN que creó.`);render()}
async function setLogin(id,name){let base=(name||'jugador').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9._-]/g,'').slice(0,20),u=prompt('Usuario para '+name,base);if(u===null)return;let p=prompt('Nuevo PIN de 4 dígitos');if(p===null)return;if(!/^\d{4}$/.test(p))return alert('El PIN debe tener 4 dígitos.');let r=await sb.rpc('admin_set_simple_login',{p_member_id:id,p_username:u,p_pin:p});r.error?alert(r.error.message):alert(`✅ Acceso listo\nUsuario: ${u}\nPIN: ${p}`)}
async function adminStatus(id,s){let reason=s==='activo'?null:prompt('Motivo:','Control de Presidencia');if(s!=='activo'&&reason===null)return;let ends=null;if(s==='suspension_momentanea')ends=new Date(Date.now()+3*3600000).toISOString();rpc('set_member_access_status',{p_member_id:id,p_status:s,p_reason:reason,p_ends_at:ends})}async function releaseTable(id,n){let reason=prompt('Motivo para liberar '+n,'Partida bloqueada o abandonada');if(reason)rpc('admin_release_table',{p_table_id:id,p_reason:reason})}
async function more(){if(sub){let back='<button class="btn dark" data-a="backMore">← Más</button>';if(sub==='Estadísticas')return back+await playerStats();if(sub==='Turnos')return back+await turns();if(sub==='Perfil')return back+profile();if(sub==='Presidencia')return back+await admin()}let items=[['Estadísticas','📈 Estadísticas de jugadores'],['Turnos','⚔️ Retadores'],['Perfil','👤 Mi perfil'],...(me.role==='admin'?[['Presidencia','🛡️ Presidencia']]:[])];return`<div class="hero"><div class="badge">☰ MÁS</div><h1>Todo lo demás</h1><p>Consulta el rendimiento del club y las opciones secundarias.</p></div>${items.map(([s,l])=>`<button class="tile full" data-a="sub" data-s="${s}" style="text-align:left;color:white;font-weight:1000">${l} →</button>`).join('')}<button class="tile full" data-a="logout" style="text-align:left;color:white;font-weight:1000">🚪 Salir</button>`}
async function render(){if(!session)return showLogin('in');await loadMe();if(!me)return showLogin('in','Error: no se encontró el perfil.');if(me.deleted_at||!me.active||me.access_status!=='activo'){$('#root').innerHTML=`<div class="login"><div class="card"><h2>⏳ Acceso: ${esc(me.access_status)}</h2><p class="muted">Presidencia debe habilitar tu cuenta.</p><button class="btn dark" data-a="logout">Salir</button></div></div>`;bind();return}let c=page==='Inicio'?await home():page==='Partidas'?await games():page==='Ranking'?await ranking():page==='Chat'?await clubChat():await more();$('#root').innerHTML=shell(c);enhanceHome();enhanceRanking();bind();bindPlayerSearch();let pf=document.getElementById('photoFile');if(pf)pf.onchange=()=>window.previewProfilePhoto(pf.files?.[0]);if(openGame)bindScore();setTimeout(()=>{let x=$('#clubChat');if(x)x.scrollTop=x.scrollHeight},20)}
let z=await sb.auth.getSession();session=z.data.session;await render();sb.auth.onAuthStateChange(async(_,s)=>{session=s;await loadMe();scheduleRender(50);if(s)realtime()});
let rtChannel=null;function realtime(){if(!session||rtChannel)return;rtChannel=sb.channel('titanes-live-v5').on('postgres_changes',{event:'*',schema:'public',table:'games'},payload=>{let changed=payload?.new;if(page==='Partidas'&&openGame&&changed?.id===openGame){paintScore(changed);if(changed.status==='finalizada'&&!scoreSaving)scheduleRender(120);return}if(!scoreSaving&&(page==='Inicio'||page==='Ranking'))scheduleRender(180)}).on('postgres_changes',{event:'INSERT',schema:'public',table:'score_events'},payload=>{if(Date.now()-lastLocalScoreAt<1800)return;notificationPing();if(page==='Inicio'||page==='Ranking')scheduleRender(160)}).on('postgres_changes',{event:'INSERT',schema:'public',table:'club_chat'},onClubChatRealtime).on('postgres_changes',{event:'*',schema:'public',table:'challenger_queue'},()=>{if(sub==='Turnos'||page==='Inicio')scheduleRender(180)}).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`member_id=eq.${me.id}`},payload=>{let n=payload?.new;if(n?.type==='liza_200_0')globalClubAlert(n);else notificationPing();if(page==='Inicio'||page==='Ranking')scheduleRender(120)}).subscribe()}
function appTimeout(p,ms){return Promise.race([p,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Tiempo de reconexión agotado')),ms))])}
function safeResumeReload(){let last=Number(sessionStorage.getItem('titanesResumeReload')||0);if(Date.now()-last<10000)return;sessionStorage.setItem('titanesResumeReload',String(Date.now()));saveAppState();location.reload()}
async function resumeApp(){if(resumeRunning||document.visibilityState==='hidden')return;resumeRunning=true;saveAppState();clearTimeout(renderTimer);renderAgain=false;try{let old=rtChannel;rtChannel=null;if(old)sb.removeChannel(old).catch(()=>{});let s=await appTimeout(sb.auth.getSession(),2200);session=s.data.session;if(!session)return showLogin('in','Tu sesión terminó. Entra nuevamente.');await appTimeout(loadMe(),2500);realtime();await appTimeout(render(),4500);resumeAttempts=0;sessionStorage.removeItem('titanesResumeReload');scoreToast('✅ Aplicación reconectada')}catch(e){console.warn('Reanudación forzada',e);if(navigator.onLine)safeResumeReload();else if(resumeAttempts++<2)setTimeout(resumeApp,1200)}finally{resumeRunning=false}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){lastHiddenAt=Date.now();saveAppState()}else if(Date.now()-lastHiddenAt>700)resumeApp()});document.addEventListener('resume',resumeApp);window.addEventListener('pageshow',()=>{if(lastHiddenAt||performance.getEntriesByType('navigation')[0]?.type==='back_forward')resumeApp()});window.addEventListener('online',resumeApp);window.addEventListener('focus',()=>{if(lastHiddenAt&&Date.now()-lastHiddenAt>700)resumeApp()});document.addEventListener('pointerdown',()=>{if(lastHiddenAt&&Date.now()-lastHiddenAt>700&&!resumeRunning)resumeApp()},{passive:true});
realtime();
