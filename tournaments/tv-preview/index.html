<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Titanes Dominó | Torneo en vivo</title>
<style>
*{box-sizing:border-box}:root{--bg:#07111f;--card:#0f2136;--card2:#142a44;--line:#294765;--text:#f8fafc;--muted:#9fb0c4;--gold:#f7c948;--green:#19c37d;--red:#ef4444}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
body{height:100vh;height:100dvh;padding:1.4vw;display:flex;flex-direction:column;background:radial-gradient(circle at top,#132c49 0,#07111f 52%)}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-bottom:.6vw;border-bottom:1px solid #27425f}
header small{font-size:clamp(11px,.9vw,18px);letter-spacing:.08em;color:var(--muted)}
h1{font-size:clamp(24px,2.7vw,52px);color:var(--gold);margin:.15em 0}
#status{font-size:clamp(12px,1vw,20px);font-weight:800;color:var(--muted);text-align:right}
#voice-toggle{margin-top:.45rem;padding:.55rem .9rem;border:1px solid var(--gold);border-radius:9px;background:#122943;color:var(--text);font:inherit;font-size:clamp(12px,.9vw,18px);font-weight:800;cursor:pointer}
#voice-toggle:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#voice-toggle:disabled{opacity:.55;cursor:not-allowed}
#liza-notice{position:fixed;z-index:5;left:50%;bottom:5vh;transform:translateX(-50%);width:min(92vw,1100px);padding:clamp(12px,1.2vw,22px);border:2px solid var(--gold);border-radius:14px;background:#07111fee;box-shadow:0 8px 32px #0009;text-align:center;color:#fff;font-size:clamp(18px,2vw,38px);font-weight:900}
#liza-notice[hidden]{display:none}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#matches{--cols:1;--rows:1;--score:80px;flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:clamp(6px,.7vw,14px);overflow:hidden;padding:.7vw 0}
article{min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;padding:clamp(6px,.7vw,14px);background:linear-gradient(145deg,var(--card2),var(--card));display:flex;flex-direction:column;justify-content:center}
.table-title{font-size:clamp(12px,1vw,21px);font-weight:900;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.teams{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,.5vw,10px);margin-top:clamp(4px,.5vw,10px)}
.team{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;text-align:center;background:#091827;border:1px solid #294765;border-radius:11px;padding:clamp(3px,.5vw,10px)}
.team.leading{border-color:var(--gold);box-shadow:0 0 12px #f7c94830}
.team-name{font-size:clamp(11px,.95vw,20px);font-weight:750;overflow-wrap:anywhere}
.score{font-size:var(--score);font-weight:1000;line-height:1;color:var(--green)}
.team-b .score{color:var(--red)}
.lead{font-size:clamp(9px,.7vw,15px);font-weight:900;color:var(--gold);min-height:1em}
.target{text-align:center;font-size:clamp(9px,.7vw,15px);font-weight:700;color:var(--muted);margin-top:3px}
.empty{grid-column:1/-1;display:grid;place-items:center;border:1px dashed #45637e;border-radius:14px;text-align:center;color:var(--muted);font-size:clamp(18px,2vw,30px)}
.bracket-pane{flex:0 0 auto;max-height:18vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#091827;padding:7px 12px}
.bracket-pane h2{font-size:clamp(12px,1vw,18px);color:var(--gold);margin:2px 0}
#bracket{display:flex;gap:8px 18px;flex-wrap:wrap;margin:4px 0;padding-left:20px;font-size:clamp(10px,.75vw,15px);color:#d4e2f0}
footer{text-align:center;color:var(--muted);font-size:clamp(10px,.7vw,14px);font-weight:800;padding-top:.5vw}
</style></head><body>
<header><div><small>CLUB DE DOMINÓ LOS TITANES DE LOS GUANDULES</small><h1 id="title">🏆 TITANES DOMINÓ · TORNEO</h1></div><div><div id="status" role="status" aria-live="polite">Esperando datos del laboratorio…</div><button id="voice-toggle" type="button" aria-pressed="true">🔊 Voz automática activa</button></div></header>
<aside id="liza-notice" role="status" aria-live="assertive" aria-atomic="true" hidden></aside>
<main><div class="grid" id="matches"></div><section class="bracket-pane"><h2>Cuadro de eliminatorias</h2><ul id="bracket"></ul></section></main>
<footer>MARCADOR DEL TORNEO · SOLO LECTURA · La anotación se realiza desde el módulo móvil</footer>
<script src="../shared/tv-snapshot.js"></script><script src="../shared/local-preview-sync.js"></script><script src="../shared/remote-tv-client.js"></script><script src="viewer.js"></script></body></html>
