<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Historial y Proyección · Titanes Dominó</title><meta name="theme-color" content="#07111f"><style>:root{--bg:#07111f;--card:#10243a;--card2:#142a44;--line:#294765;--text:#f8fafc;--muted:#9fb0c4;--gold:#f7c948;--green:#19c37d;--blue:#3b82f6;--red:#ef4444;--purple:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173454,#07111f 52%);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:14px 12px 80px}.hero,.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:15px;margin:10px 0}.hero{background:linear-gradient(135deg,#173b62,#4b2f84 60%,#7c2d12)}h1,h2,h3{margin:7px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.muted{color:var(--muted)}.small{font-size:12px}.badge{border:1px solid #ffffff25;background:#ffffff10;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.btn{border:0;border-radius:14px;padding:11px 13px;font-weight:1000;min-height:44px;cursor:pointer;text-decoration:none;display:inline-grid;place-items:center}.dark{background:#294765;color:white}.gold{background:var(--gold);color:#111}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.tabs button{border:1px solid #45637e;background:#091827;color:#fff;border-radius:13px;padding:10px;font-weight:900}.tabs button.on{background:var(--gold);color:#111;border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#091827;border:1px solid #294765;border-radius:15px;padding:11px;text-align:center}.stat b{display:block;font-size:23px;color:var(--gold)}.tableWrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:760px}.tbl th,.tbl td{padding:9px 7px;border-bottom:1px solid #294765;text-align:center}.tbl th{font-size:11px;color:#9fb0c4;position:sticky;top:0;background:#10243a}.tbl td.name{text-align:left;font-weight:900}.pos{font-weight:1000;color:var(--gold)}.eligible{color:#86efac}.notEligible{color:#fca5a5}.field{width:100%;min-height:46px;border:1px solid #45637e;background:#091827;color:#fff;border-radius:13px;padding:10px}.searchResults{display:grid;gap:5px;margin-top:6px}.pick{border:1px solid #38516d;background:#091827;color:#fff;border-radius:12px;padding:10px;text-align:left}.projection{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.proj{background:#091827;border:1px solid #294765;border-radius:14px;padding:10px;text-align:center}.proj b{display:block;color:#f7c948;font-size:20px}.periodCard{border:1px solid #38516d;background:#091827;border-radius:16px;padding:12px;margin:8px 0}.warn{padding:10px;border:1px solid #854d0e;background:#2a1f08;color:#fde68a;border-radius:13px}.notice{padding:11px;border-radius:14px;background:#102d25;border:1px solid #1f6f54;color:#bbf7d0}@media(max-width:640px){.tabs{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.projection{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}}</style></head><body><main class="wrap"><section class="hero"><div class="row"><div class="grow"><span class="badge">📚 HISTORIAL Y PROYECCIÓN</span><h1>Tu rendimiento no se pierde cuando cambia la semana</h1><p>Consulta cortes anteriores, el mes en curso, puntos acumulados y proyección mensual.</p></div><a class="btn dark" href="/">← App</a></div></section><div class="tabs"><button data-tab="resumen" class="on">Resumen</button><button data-tab="semanas">Semanas</button><button data-tab="mes">Mes</button><button data-tab="jugador">Jugador</button></div><section id="app" class="card">Cargando historial…</section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://hvpyngkqtqzvmweavego.supabase.co','sb_publishable_fZbTJCeuM8otLDnnoxRc9w_OGdZIXhX'),app=document.querySelector('#app');let me=null,tab='resumen',members=[],monthRows=[],weekRows=[],previousWeekRows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=n=>Number(n||0);const pct=n=>`${num(n).toFixed(2)}%`;const money=n=>num(n).toLocaleString('es-DO',{maximumFractionDigits:2});function rdMidnightUTC(y,m,d){return new Date(Date.UTC(y,m,d,4,0,0))}function nowRDParts(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Santo_Domingo',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).formatToParts(new Date());const o={};parts.forEach(p=>o[p.type]=p.value);return{y:+o.year,m:+o.month-1,d:+o.day}}function periods(){const n=nowRDParts(),today=rdMidnightUTC(n.y,n.m,n.d),dow=new Date(Date.UTC(n.y,n.m,n.d)).getUTCDay(),curWeek=rdMidnightUTC(n.y,n.m,n.d-dow),prevWeek=new Date(curWeek.getTime()-7*864e5),monthStart=rdMidnightUTC(n.y,n.m,1),nextMonth=rdMidnightUTC(n.m===11?n.y+1:n.y,n.m===11?0:n.m+1,1);return{today,curWeek,prevWeek,monthStart,nextMonth,now:new Date()}}async function rank(from,to,min){const r=await sb.rpc('titanes_ranking_v2_compat',{p_from:from.toISOString(),p_to:to.toISOString(),p_min_games:min});if(r.error)throw r.error;return r.data||[]}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML='<div class="warn">Debes iniciar sesión en Titanes Dominó primero.</div>';return}const mr=await sb.from('members').select('id,full_name,nickname,photo_url').eq('auth_user_id',session.user.id).single();if(mr.error)return app.innerHTML='<div class="warn">No pude identificar tu perfil.</div>';me=mr.data;const mm=await sb.from('members').select('id,full_name,nickname,photo_url,login_username').eq('active',true).eq('access_status','activo').is('deleted_at',null).eq('is_guest',false);members=mm.data||[];await load();bindTabs()}async function load(){const p=periods();[monthRows,weekRows,previousWeekRows]=await Promise.all([rank(p.monthStart,p.now,40),rank(p.curWeek,p.now,10),rank(p.prevWeek,p.curWeek,10)]);render()}function mine(rows){return rows.find(x=>x.member_id===me.id)}function statusEligibility(r,min){return num(r?.games_played)>=min?'<span class="eligible">✓ Elegible</span>':`<span class="notEligible">${num(r?.games_played)}/${min} PJ</span>`}function stats(r,min){if(!r)return'<div class="notice">Todavía no tienes partidas en este período.</div>';return`<div class="grid"><div class="stat"><span>PJ</span><b>${r.games_played}</b></div><div class="stat"><span>PG</span><b>${r.games_won}</b></div><div class="stat"><span>PP</span><b>${r.games_lost}</b></div><div class="stat"><span>Average Titanes</span><b>${pct(r.average_titanes)}</b></div><div class="stat"><span>% victorias</span><b>${pct(r.win_pct)}</b></div><div class="stat"><span>Puntos</span><b>${money(r.total_points)}</b></div><div class="stat"><span>Posición</span><b>#${r.rank_position||'—'}</b></div><div class="stat"><span>Requisito</span><b style="font-size:13px">${statusEligibility(r,min)}</b></div></div>`}function table(rows,min){return`<div class="tableWrap"><table class="tbl"><thead><tr><th>#</th><th>Jugador</th><th>PJ</th><th>PG</th><th>PP</th><th>Average</th><th>% Vic.</th><th>Puntos</th><th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="pos">${r.rank_position||'—'}</td><td class="name">${esc(r.player_name)}</td><td>${r.games_played}</td><td>${r.games_won}</td><td>${r.games_lost}</td><td>${pct(r.average_titanes)}</td><td>${pct(r.win_pct)}</td><td>${money(r.total_points)}</td><td>${statusEligibility(r,min)}</td></tr>`).join('')}</tbody></table></div>`}function projection(r){if(!r)return'<div class="notice">Sin datos suficientes para proyectar.</div>';const p=periods(),elapsed=Math.max(1,Math.floor((p.now-p.monthStart)/864e5)+1),days=Math.round((p.nextMonth-p.monthStart)/864e5),factor=days/elapsed;return`<div class="projection"><div class="proj"><span>PJ proyectadas</span><b>${Math.round(num(r.games_played)*factor)}</b></div><div class="proj"><span>PG proyectadas</span><b>${Math.round(num(r.games_won)*factor)}</b></div><div class="proj"><span>PP proyectadas</span><b>${Math.round(num(r.games_lost)*factor)}</b></div><div class="proj"><span>Puntos proyectados</span><b>${Math.round(num(r.total_points)*factor).toLocaleString('es-DO')}</b></div><div class="proj"><span>Average actual</span><b>${pct(r.average_titanes)}</b></div></div><p class="small muted">Proyección lineal según el ritmo acumulado durante los ${elapsed} días transcurridos del mes. No garantiza el resultado final.</p>`}function renderResumen(){const pw=mine(previousWeekRows),mo=mine(monthRows),cw=mine(weekRows);return`<h2>👤 ${esc(me.nickname||me.full_name)}</h2><h3>🏁 Resultado de la semana anterior</h3>${stats(pw,10)}<h3>🟢 Semana actual</h3>${stats(cw,10)}<h3>📅 Mes en curso</h3>${stats(mo,40)}<h3>🔭 Proyección del mes</h3>${projection(mo)}`}function renderWeeks(){const p=periods();return`<h2>🏁 Historial semanal</h2><div class="periodCard"><b>Semana anterior</b><div class="small muted">Corte: domingo 12:00 a. m. → domingo 12:00 a. m. · mínimo oficial: 10 PJ</div>${table(previousWeekRows,10)}</div><div class="periodCard"><b>Semana actual</b><div class="small muted">En progreso · mínimo oficial: 10 PJ</div>${table(weekRows,10)}</div><div class="warn">El histórico disponible en la base comienza el 1 de septiembre de 2026. Los futuros cortes semanales seguirán consultables aquí aunque el ranking principal se reinicie.</div>`}function renderMonth(){return`<h2>📅 Mes en curso</h2><div class="small muted">Todos los jugadores aparecen; el ranking mensual oficial exige 40 PJ.</div>${table(monthRows,40)}<h3>🔭 Mi proyección mensual</h3>${projection(mine(monthRows))}<div class="periodCard"><b>Historial mensual</b><div class="small muted">Septiembre 2026 es el primer mes con datos almacenados. Los próximos meses quedarán disponibles como períodos separados.</div></div>`}function renderPlayer(){return`<h2>🔎 Consultar jugador</h2><input id="playerSearch" class="field" placeholder="Busca por nombre, apodo o usuario" autocomplete="off"><div id="playerResults" class="searchResults"></div><div id="playerDetail">${playerDetail(me.id)}</div>`}function playerDetail(id){const m=members.find(x=>x.id===id)||me,pw=previousWeekRows.find(x=>x.member_id===id),cw=weekRows.find(x=>x.member_id===id),mo=monthRows.find(x=>x.member_id===id);return`<div class="periodCard"><h2>${esc(m.nickname||m.full_name)}</h2><h3>Semana anterior</h3>${stats(pw,10)}<h3>Semana actual</h3>${stats(cw,10)}<h3>Mes actual</h3>${stats(mo,40)}<h3>Proyección mensual</h3>${projection(mo)}</div>`}function bindPlayer(){const input=document.querySelector('#playerSearch'),res=document.querySelector('#playerResults');if(!input)return;const draw=()=>{const q=input.value.trim().toLowerCase();if(!q){res.innerHTML='';return}const found=members.filter(m=>`${m.nickname||''} ${m.full_name||''} ${m.login_username||''}`.toLowerCase().includes(q)).slice(0,10);res.innerHTML=found.map(m=>`<button class="pick" data-id="${m.id}"><b>${esc(m.nickname||m.full_name)}</b><div class="small muted">${esc(m.full_name||'')}</div></button>`).join('')||'<div class="muted">No encontrado</div>';res.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{document.querySelector('#playerDetail').innerHTML=playerDetail(b.dataset.id);res.innerHTML='';input.value=members.find(x=>x.id===b.dataset.id)?.nickname||''})};input.oninput=draw}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));app.innerHTML=tab==='resumen'?renderResumen():tab==='semanas'?renderWeeks():tab==='mes'?renderMonth():renderPlayer();if(tab==='jugador')bindPlayer()}function bindTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}init();</script></body></html>
