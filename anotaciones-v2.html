<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Anotaciones V2 · Titanes Dominó</title><meta name="theme-color" content="#07111f"><style>:root{--bg:#07111f;--card:#10243a;--card2:#142a44;--line:#294765;--text:#f8fafc;--muted:#9fb0c4;--gold:#f7c948;--green:#19c37d;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173454,#07111f 50%);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}.wrap{max-width:820px;margin:auto;padding:14px 12px 70px}.hero,.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:15px;margin:10px 0}.hero{background:linear-gradient(135deg,#173b62,#4b2f84 60%,#7c2d12)}h1,h2,h3{margin:7px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.muted{color:var(--muted)}.small{font-size:12px}.badge{border:1px solid #ffffff25;background:#ffffff10;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.btn{border:0;border-radius:14px;padding:11px 13px;font-weight:1000;min-height:44px;cursor:pointer}.full{width:100%}.green{background:var(--green);color:#07111f}.red{background:var(--red);color:#fff}.blue{background:var(--blue);color:#fff}.dark{background:#294765;color:#fff}.gold{background:var(--gold);color:#111}.field{width:100%;min-height:48px;border:1px solid #45637e;background:#091827;color:#fff;border-radius:14px;padding:11px;margin:5px 0}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.team{background:#091827;border:1px solid #294765;border-radius:17px;padding:13px}.score{font-size:42px;font-weight:1000}.specialGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.special{border:2px solid #ffffff25;border-radius:18px;padding:15px 7px;color:#fff;font-weight:1000;min-height:88px}.special b{display:block;font-size:25px;margin-top:5px}.chivo{background:linear-gradient(135deg,#7c2d12,#ef4444)}.pase{background:linear-gradient(135deg,#4c1d95,#8b5cf6)}.multa{background:linear-gradient(135deg,#92400e,#f59e0b)}.teamPick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.teamBtn{background:#10243a;color:#fff;border:2px solid #45637e;border-radius:15px;padding:13px;font-weight:1000}.teamBtn.on{border-color:var(--gold);box-shadow:0 0 0 2px #f7c94833}.entry{padding:12px 0;border-bottom:1px solid #ffffff15}.notice{padding:11px;border-radius:14px;background:#102d25;border:1px solid #1f6f54;color:#bbf7d0}.error{background:#3a1517;border-color:#7f1d1d;color:#fecaca}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000a;z-index:100;display:grid;place-items:center;padding:12px}.modalBox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#0d2034;border:1px solid #45637e;border-radius:20px;padding:16px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}@media(max-width:560px){.specialGrid{grid-template-columns:1fr}.score{font-size:34px}.entry.row{align-items:flex-start}.entry .actions{width:100%;justify-content:flex-start}}</style></head><body><main class="wrap"><section class="hero"><div class="row"><div class="grow"><span class="badge">🁣 ANOTACIONES TITANES V2</span><h1>Anotar rápido y corregir seguro</h1><p>Marcador oficial intacto. Los puntos individuales se reparten 50/50 entre la pareja beneficiada.</p></div><a href="/" class="btn dark" style="text-decoration:none">← App</a></div></section><div id="app" class="card">Cargando…</div></main><div id="modal" class="hidden"></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://hvpyngkqtqzvmweavego.supabase.co','sb_publishable_fZbTJCeuM8otLDnnoxRc9w_OGdZIXhX'),app=document.querySelector('#app'),modal=document.querySelector('#modal');let me=null,games=[],game=null,players=[],events=[],team='L';const labels={normal:'Dominación',multa:'Multa',capicua:'Capicúa',paso_corrido:'Paso corrido',paso_salida_doble:'Salida doble',dos_carotas:'2 caritas',chivo:'Chivo',pase_con_ficha:'Pase con ficha'};const special={chivo:100,pase_con_ficha:100,multa:30};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nm=x=>x?.nickname||x?.full_name||'Jugador';async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){app.innerHTML='<div class="notice error">Debes iniciar sesión primero en Titanes Dominó.</div>';return}const r=await sb.from('members').select('id,role,full_name,nickname').eq('auth_user_id',session.user.id).single();if(r.error||!r.data){app.innerHTML='<div class="notice error">No se encontró tu perfil.</div>';return}me=r.data;await loadGames()}async function loadGames(){const r=await sb.from('live_games_feed').select('*').eq('status','activa').order('started_at');games=r.data||[];renderGameList()}function renderGameList(){app.innerHTML=`<div class="row"><div class="grow"><h2>Partidas en curso</h2><div class="small muted">Selecciona la mesa que vas a anotar.</div></div><button id="refresh" class="btn dark">↻</button></div>${games.map(x=>`<button class="btn dark full" data-game="${x.id}" style="text-align:left;margin:5px 0"><b>${esc(x.table_name||'Mesa')}</b><span style="float:right">${x.largos_score} — ${x.cortos_score}</span></button>`).join('')||'<div class="notice">No hay partidas activas ahora mismo.</div>'}`;document.querySelector('#refresh').onclick=loadGames;document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>openGame(b.dataset.game))}async function openGame(id){const[g,p,e]=await Promise.all([sb.from('games').select('*,club_tables(name)').eq('id',id).single(),sb.from('game_players').select('team,member_id,seat,members(id,full_name,nickname)').eq('game_id',id),sb.from('score_events').select('id,game_id,team,event_type,points,voided,created_at,responsible_member_id,credited_member_id').eq('game_id',id).order('created_at',{ascending:false}).limit(40)]);if(g.error)return alert(g.error.message);game=g.data;players=p.data||[];events=e.data||[];renderGame()}function pairName(t){return players.filter(x=>x.team===t).map(x=>nm(x.members)).join(' + ')}function renderGame(){if(!game)return;app.innerHTML=`<div class="row"><button id="back" class="btn dark">← Mesas</button><div class="grow"><b>${esc(game.club_tables?.name||'Mesa')}</b></div><button id="reload" class="btn dark">↻</button></div><div class="scoreboard"><div class="team"><b>🔵 Largos</b><div class="score">${game.largos_score}</div><div class="small muted">${esc(pairName('L'))}</div></div><b>VS</b><div class="team"><b>🔴 Cortos</b><div class="score">${game.cortos_score}</div><div class="small muted">${esc(pairName('C'))}</div></div></div><div class="card"><h2>⚡ Anotaciones</h2><h3>1. Equipo que recibe los puntos</h3><div class="teamPick"><button id="pickL" class="teamBtn ${team==='L'?'on':''}">🔵 Largos</button><button id="pickC" class="teamBtn ${team==='C'?'on':''}">🔴 Cortos</button></div><h3>2. Dominación normal</h3><div class="row"><input id="normalPts" class="field grow" type="number" inputmode="decimal" min="1" max="250" placeholder="Puntos de la dominación"><button id="normalBtn" class="btn green">✅ Anotar</button></div><div class="small muted">Ejemplo: 80 puntos = 80 al marcador de la pareja y 40 + 40 en estadísticas individuales.</div><h3>3. Botones especiales</h3><div class="specialGrid"><button class="special chivo" data-special="chivo">🐐 CHIVO<b>+100</b></button><button class="special pase" data-special="pase_con_ficha">🁣 PASE CON FICHA<b>+100</b></button><button class="special multa" data-special="multa">⚠️ MULTA<b>+30</b></button></div><div class="small muted">Chivo y Pase: −10% al average del responsable. Multa: −3%. Los puntos positivos se reparten 50/50 entre la pareja beneficiada.</div></div><div class="card"><h2>📜 Corregir / Anular</h2>${events.map(x=>`<div class="entry row" style="opacity:${x.voided?.55:1}"><div class="grow"><b>${x.team==='L'?'🔵':'🔴'} ${esc(labels[x.event_type]||x.event_type)} · +${x.points}</b><div class="small muted">${new Date(x.created_at).toLocaleString('es-DO')}${x.voided?' · ANULADA':''}</div></div>${x.voided?'':`<div class="actions"><button class="btn blue" data-edit="${x.id}">✏️ Corregir</button><button class="btn red" data-void="${x.id}" data-points="${x.points}">🗑️ Anular</button></div>`}</div>`).join('')||'<p class="muted">Sin anotaciones todavía.</p>'}</div>`;document.querySelector('#back').onclick=()=>{game=null;loadGames()};document.querySelector('#reload').onclick=()=>openGame(game.id);document.querySelector('#pickL').onclick=()=>{team='L';renderGame()};document.querySelector('#pickC').onclick=()=>{team='C';renderGame()};document.querySelector('#normalBtn').onclick=addNormal;document.querySelectorAll('[data-special]').forEach(b=>b.onclick=()=>addSpecial(b.dataset.special));document.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>voidEvent(b.dataset.void,+b.dataset.points));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editEvent(b.dataset.edit))}function firstPlayer(t){return players.find(x=>x.team===t)?.member_id}function opposite(t){return t==='L'?'C':'L'}async function addNormal(){const pts=Math.round(Number(document.querySelector('#normalPts').value));if(!pts||pts<1)return alert('Escribe los puntos de la dominación.');const{error}=await sb.rpc('add_score_event',{p_game_id:game.id,p_team:team,p_event_type:'normal',p_points:pts,p_credited_member_id:firstPlayer(team),p_responsible_member_id:null});if(error)return alert(error.message);await openGame(game.id)}async function addSpecial(type){const opp=opposite(team),candidates=players.filter(x=>x.team===opp);showModal(`<h2>${type==='chivo'?'🐐 Chivo +100':type==='pase_con_ficha'?'🁣 Pase con ficha +100':'⚠️ Multa +30'}</h2><p>¿Quién cometió el error?</p>${candidates.map(x=>`<button class="btn dark full" data-responsible="${x.member_id}">${esc(nm(x.members))}</button>`).join('')}<button class="btn red full" id="cancelModal">Cancelar</button>`);document.querySelector('#cancelModal').onclick=hideModal;document.querySelectorAll('[data-responsible]').forEach(b=>b.onclick=async()=>{const responsible=b.dataset.responsible;if(!confirm(`Confirmar ${labels[type]}: +${special[type]} para ${team==='L'?'Largos':'Cortos'}?`))return;const{error}=await sb.rpc('add_score_event',{p_game_id:game.id,p_team:team,p_event_type:type,p_points:special[type],p_credited_member_id:firstPlayer(team),p_responsible_member_id:responsible});if(error)return alert(error.message);hideModal();await openGame(game.id)})}async function voidEvent(id,pts){const reason=prompt(`Motivo para anular ${pts} puntos:`,`Anotación registrada por error`);if(reason===null)return;if(!reason.trim())return alert('Debes indicar el motivo.');if(!confirm('¿Confirmas anular esta anotación? El marcador se recalculará automáticamente.'))return;const{error}=await sb.rpc('void_score_event',{p_event_id:id,p_reason:reason.trim()});if(error)return alert(error.message);await openGame(game.id)}function editEvent(id){const ev=events.find(x=>x.id===id);if(!ev)return;showModal(`<div class="row"><h2 class="grow">✏️ Corregir anotación</h2><button id="closeEdit" class="btn dark">✕</button></div><label>Equipo correcto</label><select id="eTeam" class="field"><option value="L" ${ev.team==='L'?'selected':''}>🔵 Largos</option><option value="C" ${ev.team==='C'?'selected':''}>🔴 Cortos</option></select><label>Tipo</label><select id="eType" class="field"><option value="normal" ${ev.event_type==='normal'?'selected':''}>Dominación</option><option value="chivo" ${ev.event_type==='chivo'?'selected':''}>Chivo +100</option><option value="pase_con_ficha" ${ev.event_type==='pase_con_ficha'?'selected':''}>Pase con ficha +100</option><option value="multa" ${ev.event_type==='multa'?'selected':''}>Multa +30</option></select><label>Puntos (solo dominación)</label><input id="ePts" class="field" type="number" value="${ev.points}" min="1" max="250"><div id="responsibleBox"></div><label>Motivo</label><input id="eReason" class="field" value="Corrección de anotación"><button id="saveEdit" class="btn blue full">Guardar corrección</button>`);const refreshResp=()=>{const t=document.querySelector('#eTeam').value,type=document.querySelector('#eType').value,need=['chivo','pase_con_ficha','multa'].includes(type),box=document.querySelector('#responsibleBox');if(!need){box.innerHTML='';return}box.innerHTML=`<label>Responsable del error</label><select id="eResp" class="field">${players.filter(x=>x.team===opposite(t)).map(x=>`<option value="${x.member_id}" ${x.member_id===ev.responsible_member_id?'selected':''}>${esc(nm(x.members))}</option>`).join('')}</select>`};document.querySelector('#eTeam').onchange=refreshResp;document.querySelector('#eType').onchange=refreshResp;refreshResp();document.querySelector('#closeEdit').onclick=hideModal;document.querySelector('#saveEdit').onclick=async()=>{const t=document.querySelector('#eTeam').value,type=document.querySelector('#eType').value,pts=Math.round(Number(document.querySelector('#ePts').value)),resp=document.querySelector('#eResp')?.value||null,reason=document.querySelector('#eReason').value.trim();const{error}=await sb.rpc('correct_score_event_v2',{p_event_id:id,p_new_team:t,p_new_event_type:type,p_new_points:pts||null,p_new_responsible_member_id:resp,p_new_credited_member_id:firstPlayer(t),p_reason:reason||'Corrección de anotación'});if(error)return alert(error.message);hideModal();await openGame(game.id)}}function showModal(html){modal.className='modal';modal.innerHTML=`<div class="modalBox">${html}</div>`}function hideModal(){modal.className='hidden';modal.innerHTML=''}init();</script><script type="module" src="/annotation-specials.js?v=3"></script></body></html>
